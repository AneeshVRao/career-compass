name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to a PR makes the first run's result irrelevant; cancel it rather
# than paying for both and waiting on the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version this repo is developed against. Floating on
          # "latest" means a bun release can turn a green PR red with no change
          # to the code, which is the fastest way to teach people to ignore CI.
          bun-version: 1.3.14

      # --frozen-lockfile makes an out-of-date bun.lock a build failure rather
      # than something CI silently fixes for itself and then forgets to report.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun run test

      # No Supabase env vars are set here on purpose, and the build does not need
      # them: the client throws only on first *use*, from inside a Proxy getter,
      # so bundling succeeds without credentials. Verified by building with .env
      # removed. If this step ever starts failing for a missing variable, that
      # means something began reading env at module scope — worth knowing.
      - name: Build
        run: bun run build

  # Deliberately not run here: `bun run test:e2e`. The Playwright specs need live
  # Supabase credentials (including the service-role key) and each run of the
  # signup spec spends one email against the project's hourly quota, so wiring
  # them to every PR would both leak a powerful secret into CI and guarantee
  # flakes on quota exhaustion. Run them locally with `--workers=2`; see
  # docs/DEVELOPMENT.md.
